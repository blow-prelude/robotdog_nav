# Navigation parameters for waypoint navigation with obstacle avoidance

nav_waypoint_node:
  ros__parameters:
    # Basic navigation parameters
    origin_lat: 0.0  # Latitude of origin point
    origin_lon: 0.0  # Longitude of origin point
    origin_alt: 0.0  # Altitude of origin point
    # origin_lat: 47.3667
    # origin_lon: 8.55000
    # origin_alt: 500.258947

    # Tolerance for reaching a goal (meters)
    goal_tolerance: 1.0

    # Tolerance for yaw angle (radians)
    yaw_tolerance: 0.8

    # Linear velocity (m/s)
    linear_velocity: 0.8

    # Angular velocity limit (rad/s)
    angular_velocity_limit: 1.0

    # Control frequency (Hz)
    control_frequency: 10.0

    # Lookahead distance for path following (meters)
    lookahead_distance: 2.0

    # Robot physical parameters
    robot_radius: 0.5

    # Transform tolerance
    transform_tolerance: 0.2

    # Navigation2 integration parameters
    robot_base_frame: "base_link"
    global_frame: "world"

    # Controller selection: true for using controller_server with FollowPath (with obstacle avoidance),
    # false for using pure pursuit algorithm directly
    use_controller_server: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: world
      robot_base_frame: base_link
      rolling_window: true
      width: 16
      height: 16
      resolution: 0.05
      transform_tolerance: 0.1
      footprint: "[ [0.50, 0.2], [0.50, -0.2], [-0.50, -0.2], [-0.50, 0.2] ]"
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: pointcloud
        combination_method: 0
        footprint_clearing_enabled: true
        pointcloud:
          topic: /livox/lidar
          raytrace_min_range: 0.0
          raytrace_max_range: 8.0
          min_obstacle_height: 0.4
          max_obstacle_height: 1.0
          obstacle_min_range: 0.0
          obstacle_max_range: 8.0
          clearing: true
          marking: true
          inf_is_valid: true
          sensor_frame: "livox"
          data_type: "PointCloud2"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 1.0
      always_send_full_costmap: true

controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /world_odom
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.02
    min_y_velocity_threshold: 0.02
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 5.0
    progress_checker_plugin: "progress_checker"
    current_goal_checker: "general_goal_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.2
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      lookahead_distance: 5.0
      min_lookahead_distance: 0.5
      max_lookahead_distance: 5.0
      use_velocity_scaled_lookahead_distance: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_collision_detection: false
      desired_linear_vel: 0.5
      min_linear_vel: 0.1
      max_linear_vel: 1.0
      max_angular_vel: 1.2
      min_angular_vel: 0.0
      acc_lim_linear: 0.8
      acc_lim_angular: 1.5
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.05
      regulate_linear_vel: true
      allow_backward: false

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 10.0
    node_names: ['controller_server']