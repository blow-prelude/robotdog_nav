# ExecuteTask Server Parameters

execute_task_node:
  ros__parameters:
    # Agent identification
    agent_id: "uav1"              # Must match the agent_id in task requests
    
    # Default waypoint settings
    default_waypoint_frame: "gps"  # "gps" or "local"
    default_velocity: 1.0          # Default velocity for waypoints (m/s)
    default_yaw: 0.0               # Default yaw angle (rad)
    
    # Optional: override GPS origin if needed
    # origin_lat: 30.06888
    # origin_lon: 120.04646
    # origin_alt: 5.0
