# MultiGoal -> Nav2 FollowWaypoints 桥接节点
# 注意：origin_lat/lon/alt 必须与 gps_imu_fusion 的 config/params.yaml 保持一致。

multi_goal_bridge_node:
  ros__parameters:
    use_sim_time: true

    origin_lat: 0.0
    origin_lon: 0.0
    origin_alt: 0.0
    origin_source: "params"                 # params | topic
    origin_topic: "/mavros/global_position/gp_origin"

    world_frame: "world"
    robot_base_frame: "base_link"
    odom_topic: "/world_odom"
    gps_topic: "/gps/data"
    multi_goal_topic: "/waypoint_goals"
    follow_waypoints_action: "follow_waypoints"
    nav_status_topic: "/nav_status"
    speed_limit_topic: "speed_limit"
    cancel_service: "nav/cancel"

    yaw_mode: "path"                        # path | msg
    respect_waypoint_velocity: true
    min_goal_velocity: 0.1
    max_goal_velocity: 0.6

    action_server_wait_timeout_sec: 5.0
    goal_retry_interval_sec: 0.5
    cancel_timeout_sec: 3.0
    stall_timeout_sec: 30.0
    task_timeout_sec: 0.0                   # 0 表示不限制整体任务时长
    require_tf_before_goal: true
    tf_wait_timeout_sec: 5.0

    origin_check_enabled: true
    origin_check_tolerance: 5.0
    origin_check_max_age_sec: 1.0
    max_goal_distance_m: 5000.0

    status_rate_hz: 10.0
    status_completed_hold_sec: 2.0
    status_goal_reached_hold_sec: 0.3
